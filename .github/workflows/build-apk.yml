name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # ⬇️ ЗДЕСЬ МЕНЯЕМ ИМЯ ФАЙЛА
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/VideoDownloader-v1.5.apk

      # ⬇️ ЗДЕСЬ МЕНЯЕМ ИМЯ АРТЕФАКТА
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.5
          path: release/VideoDownloader-v1.5.apk
          if-no-files-found: error

      # ⬇️ ЗДЕСЬ МЕНЯЕМ ФАЙЛ ДЛЯ РЕЛИЗА
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/VideoDownloader-v1.5.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## VideoDownloader ${{ github.ref_name }}
            
            - Фото-карусель из TikTok
            - Скачивание всех фото
            - Иконки типа контента (🎬/🖼)
          draft: false
          prerelease: false
