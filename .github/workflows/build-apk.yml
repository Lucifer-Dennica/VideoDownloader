name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "✅ Keystore decoded:"
          ls -la app/release.jks

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Verify signing
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK_PATH"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK_PATH" || true

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/VideoDownloader-v1.7.5.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.7.5
          path: release/VideoDownloader-v1.7.5.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/VideoDownloader-v1.7.5.apk
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ github.event.release.tag_name }}
          body: |
            ## VideoDownloader ${{ github.event.release.tag_name }}
            - Кнопка «Поддержать разработчика» (DonationAlerts)
            - Поделиться приложением / Оценить в RuStore
            - Контакты разработчика: Telegram, email
          draft: false
          prerelease: false
