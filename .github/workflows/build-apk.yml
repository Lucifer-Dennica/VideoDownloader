name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/VideoDownloader-v1.6.2.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.6.2
          path: release/VideoDownloader-v1.6.2.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/VideoDownloader-v1.6.2.apk
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ github.event.release.tag_name }}
          body: |
            ## VideoDownloader ${{ github.event.release.tag_name }}
            - Выбор качества видео (до 360p)
            - Автопаста из буфера
            - Автоскачивание
            - Режим «Только аудио» (mp3, Music/VideoDownloader/)
            - Мультивыбор: поделиться/удалить
            - Удаление файлов из памяти
            - Фикс: одно окно приложения (singleTask)
          draft: false
          prerelease: false
